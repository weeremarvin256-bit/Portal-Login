<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Student portal sign-up template">
  <title>Student Sign Up | University Student Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="card">
    <p class="demo-banner">Template page: connect it to your own registration API before use.</p>

    <header class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/>
      </svg>
      <h1 data-institution>University Student Portal</h1>
      <p>Create your student account</p>
    </header>

    <div id="alert" class="alert" role="alert" aria-live="polite"></div>

    <form id="signup-form" novalidate>
      <div class="row">
        <div class="field">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>
          <p class="error" id="firstName-error"></p>
        </div>
        <div class="field">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
          <p class="error" id="lastName-error"></p>
        </div>
      </div>

      <div class="field">
        <label for="regNo">Registration number</label>
        <input id="regNo" name="regNo" type="text" autocomplete="off" placeholder="e.g. 2024/XXX/001" required>
        <p class="error" id="regNo-error"></p>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="error" id="email-error"></p>
      </div>

      <div class="field">
        <label for="faculty">Faculty</label>
        <select id="faculty" name="faculty" required>
          <option value="">Select your faculty</option>
          <option>Applied Sciences</option>
          <option>Computing and Informatics</option>
          <option>Engineering</option>
          <option>Medicine</option>
          <option>Business and Management</option>
          <option>Interdisciplinary Studies</option>
        </select>
        <p class="error" id="faculty-error"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="strength-label">
          <button type="button" class="toggle-pw" data-toggle="password" aria-label="Show password">Show</button>
        </div>
        <div class="strength" aria-hidden="true"><span id="strength-bar"></span></div>
        <p class="strength-label" id="strength-label">Use 8+ characters with letters, numbers and symbols.</p>
        <p class="error" id="password-error"></p>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        <p class="error" id="confirm-error"></p>
      </div>

      <div class="field">
        <label style="font-weight:400"><input type="checkbox" id="terms" style="width:auto"> I agree to the portal terms of use</label>
        <p class="error" id="terms-error"></p>
      </div>

      <button class="btn" type="submit">Create account</button>
    </form>

    <p class="switch">Already registered? <a href="login.html">Sign in</a></p>
  </main>
</body>
</html>
